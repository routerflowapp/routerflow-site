<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#132846">
<title>Painel RouterFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a5f'/%3E%3Cpath d='M21 49 V15 H35 A9 9 0 0 1 35 33 H29 L42 48' fill='none' stroke='%23eef3fa' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='43' cy='49' r='6.3' fill='%2322c55e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
<style>
:root{--az:#132846;--az2:#1f3a5f;--az3:#2c4a72;--vd:#2e7d32;--vd2:#4ade80;--tx:#15202f;--su:#556070;--li:#e3e7ed;--fu:#f3f5f8;--am:#b45309;--vm:#b42318;--bl:#1d4ed8;--rx:#6d28d9;--sb:248px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fu);color:var(--tx);font:14px/1.5 Inter,'Segoe UI',Arial,sans-serif}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;margin:0;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bl)}
.marca{display:flex;align-items:center;gap:10px;font:800 19px Manrope,Inter,sans-serif;color:#fff;text-decoration:none}
.marca i{font-style:normal;color:var(--vd2)}
[hidden]{display:none!important}
/* entrada */
#entrada{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 20% 0%,#24497a 0%,var(--az) 60%)}
.cx-in{width:100%;max-width:410px;background:#fff;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.cx-in h1{font-size:22px;color:var(--az)}
.cx-in p{margin:0;color:var(--su)}
.campo{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;color:var(--su)}
.campo input,.campo select,.campo textarea{height:44px;border:1.5px solid #d0d5dd;border-radius:10px;padding:0 12px;font-size:15px;background:#fff;font-weight:500;color:var(--tx);width:100%}
.campo textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--vd);box-shadow:0 0 0 3px rgba(46,125,50,.12)}
.campo small{font-weight:400;color:var(--su)}
.bt{height:42px;border:0;border-radius:10px;background:var(--vd);color:#fff;font-weight:700;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.bt:hover{filter:brightness(1.06)}
.bt.sec{background:#fff;color:var(--az2);border:1.5px solid #c9d2de}
.bt.ver{background:var(--vm)}
.bt.pq{height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.bt:disabled{opacity:.55;cursor:default}
.erro{color:var(--vm);font-size:13.5px;min-height:18px}
.qr{display:flex;justify-content:center;background:#fff;border:1px solid var(--li);border-radius:12px;padding:10px}
.qr img{width:190px;height:190px}
.seg{font:12px/1.4 Consolas,monospace;word-break:break-all;color:var(--su);background:var(--fu);padding:8px 10px;border-radius:8px}
/* casca */
#painel{display:none;min-height:100vh}
.lado{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--az);color:#c9d6ea;display:flex;flex-direction:column;z-index:30;padding:16px 12px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.lado .marca{padding:4px 8px 18px}
.lado nav{display:flex;flex-direction:column;gap:2px}
.lado nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#c9d6ea;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;font-size:14px}
.lado nav button svg{width:19px;height:19px;flex:none;opacity:.85}
.lado nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.lado nav button.on{background:rgba(74,222,128,.14);color:#fff}
.lado nav button.on svg{color:var(--vd2);opacity:1}
.lado nav .n{margin-left:auto;font-size:11.5px;background:var(--vm);color:#fff;border-radius:99px;padding:1px 7px}
.lado .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 6px}
.lado .rod{margin-top:auto;padding:12px 8px 0;font-size:12.5px;color:#93a4bd;display:flex;flex-direction:column;gap:8px}
.lado .rod button{background:transparent;border:1px solid var(--az3);color:#fff;border-radius:8px;height:34px;cursor:pointer}
.miolo{margin-left:var(--sb);min-height:100vh;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:rgba(243,245,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--li);padding:12px 24px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topo h1{font-size:20px;color:var(--az);margin-right:auto}
.menu-bt{display:none;width:40px;height:40px;border-radius:10px;border:1.5px solid #c9d2de;background:#fff;cursor:pointer;align-items:center;justify-content:center}
.periodo{display:flex;background:#fff;border:1.5px solid #d0d5dd;border-radius:10px;padding:3px;gap:2px}
.periodo button{border:0;background:none;border-radius:7px;padding:5px 10px;font-weight:600;font-size:13px;color:var(--su);cursor:pointer}
.periodo button.on{background:var(--az);color:#fff}
.busca-g{height:40px;border:1.5px solid #d0d5dd;border-radius:10px;padding:0 12px;background:#fff;min-width:220px}
main{padding:20px 24px 80px;max-width:1500px;width:100%}
.fundo-menu{display:none}
/* blocos */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--li);border-radius:16px;padding:15px 16px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi .r{font-size:12px;color:var(--su);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .n{font:800 27px/1.2 Manrope,Inter,sans-serif;color:var(--az)}
.kpi .n.v{color:var(--vd)}.kpi .n.a{color:var(--am)}.kpi .n.e{color:var(--vm)}
.kpi .s{font-size:12.5px;color:var(--su)}
.kpi .d{font-size:12px;font-weight:700}.kpi .d.up{color:var(--vd)}.kpi .d.dn{color:var(--vm)}
.grade{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
.bloco{background:#fff;border:1px solid var(--li);border-radius:16px;padding:16px;min-width:0}
.bloco h2{font-size:15.5px;color:var(--az);margin-bottom:4px}
.bloco .sub{color:var(--su);font-size:12.5px;margin:0 0 12px}
.cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cab h2{margin:0;margin-right:auto}
.graf{position:relative;height:260px}
.graf.pq{height:220px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros input,.filtros select{height:38px;border:1.5px solid #d0d5dd;border-radius:9px;padding:0 10px;background:#fff;min-width:0}
.filtros input[type=search]{flex:1;min-width:180px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1.5px solid #d0d5dd;background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--su);cursor:pointer}
.pills button.on{background:var(--az);border-color:var(--az);color:#fff}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--su);text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--li);white-space:nowrap;font-weight:700}
td{padding:10px;border-bottom:1px solid #f0f2f5;vertical-align:top}
tbody tr:hover td{background:#fafbfd}
tr.clic{cursor:pointer}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:#e3f2e4;color:var(--vd)}.c-av{background:#fff3e0;color:var(--am)}.c-er{background:#fee4e2;color:var(--vm)}.c-in{background:#eef2f7;color:var(--su)}.c-bl{background:#e8efff;color:var(--bl)}.c-rx{background:#f1eaff;color:var(--rx)}
.mono{font-family:Consolas,monospace;font-size:12.5px}
.mut{color:var(--su)}
.acs{display:flex;gap:6px;flex-wrap:wrap}
.pb{height:8px;background:#eef2f7;border-radius:4px;overflow:hidden;min-width:90px}
.pb i{display:block;height:100%;background:var(--vd)}
.vazio{padding:28px 12px;text-align:center;color:var(--su)}
.lista-sim{display:flex;flex-direction:column;gap:8px}
.lista-sim .it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5}
.funil{display:flex;flex-direction:column;gap:10px}
.funil div{display:flex;align-items:center;gap:10px}
.funil b{display:block;height:30px;border-radius:8px;background:linear-gradient(90deg,var(--az2),var(--az3));color:#fff;font-size:12.5px;line-height:30px;padding:0 10px;white-space:nowrap;min-width:fit-content}
.funil span{font-size:12.5px;color:var(--su);white-space:nowrap}
/* gaveta (ficha) e janela */
.gaveta{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;z-index:50;box-shadow:-20px 0 50px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
.gaveta.on{transform:none}
.gaveta .gc{padding:16px 18px;border-bottom:1px solid var(--li);display:flex;align-items:flex-start;gap:12px;padding-top:max(16px,env(safe-area-inset-top))}
.gaveta .gc h2{font-size:18px;color:var(--az)}
.gaveta .gm{padding:16px 18px calc(30px + env(safe-area-inset-bottom));overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.x{margin-left:auto;width:36px;height:36px;border-radius:9px;border:1.5px solid #d0d5dd;background:#fff;cursor:pointer;font-size:18px;line-height:1;flex:none}
.linha-t{display:flex;flex-direction:column}
.linha-t .ev{display:flex;gap:10px;padding:8px 0;border-left:2px solid var(--li);padding-left:14px;position:relative}
.linha-t .ev:before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--az3)}
.linha-t .ev.vd:before{background:var(--vd)}.linha-t .ev.vm:before{background:var(--vm)}.linha-t .ev.am:before{background:var(--am)}
.linha-t .ev .q{font-size:12px;color:var(--su);min-width:118px}
.def{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.def dt{color:var(--su)}.def dd{margin:0;font-weight:600;word-break:break-word}
.vel{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.vel.on{opacity:1;pointer-events:auto}
.janela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;background:rgba(10,20,35,.5)}
.janela .jx{width:min(480px,100%);background:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 32px);overflow-y:auto}
.janela h3{font-size:18px;color:var(--az)}
.janela .jb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100% - 32px))}
.toast{background:var(--az);color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px}
.toast.err{background:var(--vm)}.toast.ok{background:var(--vd)}
.cfgv{position:fixed;inset:0;z-index:60;background:rgba(10,20,35,.5);display:flex;align-items:stretch;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.cfgv .cx{background:#fff;border-radius:16px;width:min(1100px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.cfgv .ch{padding:14px 18px;border-bottom:1px solid var(--li);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cfgv .ch h2{font-size:17px;color:var(--az);margin:0}.cfgv .ch .mut{font-size:12.5px}
.cfgv .ch .esp{flex:1}
.cfgv .cb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--li);background:#f7f9fc}
.cfgv .cb input,.cfgv .cb select{height:36px;border:1.5px solid #d0d5dd;border-radius:9px;padding:0 10px;font:inherit;font-size:13.5px;background:#fff;min-width:0}
.cfgv .cb input{flex:1 1 220px}
.cfgv .cm{overflow:auto;flex:1;padding:14px 18px;font-size:13px}
.cfgv .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cfgv .res .bloco{padding:12px 14px}.cfgv .res h3{font-size:13.5px;color:var(--az);margin:0 0 6px}
.cfgv .res dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}.cfgv .res dt{color:var(--su)}.cfgv .res dd{margin:0;word-break:break-word}
.arv{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.6}
.arv details{margin-left:14px}.arv>details{margin-left:0}
.arv summary{cursor:pointer;color:var(--az);font-weight:600}.arv summary .mut{font-weight:400}
.arv .kv{margin-left:14px;word-break:break-word}.arv .k{color:#6d28d9}.arv .s{color:#b45309}.arv .n{color:#1d4ed8}.arv .b{color:#2e7d32;font-weight:600}.arv .z{color:#94a3b8}
.arv mark,.dif mark{background:#fde68a;border-radius:3px}
.dif .lin{display:grid;grid-template-columns:minmax(160px,1.2fr) 1fr 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--li);font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-word}
.dif .de{color:#b42318;text-decoration:line-through}.dif .pa{color:#2e7d32}
@media (max-width:700px){.dif .lin{grid-template-columns:1fr}.cfgv{padding:0}.cfgv .cx{border-radius:0}}
.fazendo{position:fixed;inset:0;z-index:80;background:rgba(10,20,35,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.fazendo .fx{background:#fff;border-radius:16px;padding:22px 24px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:420px}
.fazendo .fx b{display:block;color:var(--az);font-size:15px}.fazendo .fx span{color:var(--su);font-size:13px}
.giro{width:30px;height:30px;border:3.5px solid #dbe4ef;border-top-color:var(--vd);border-radius:50%;animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
.barra-topo{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,transparent,var(--vd2),var(--vd),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:corre 1s linear infinite}
@keyframes corre{from{background-position:-50% 0}to{background-position:150% 0}}
.demo{background:#fff3e0;color:var(--am);font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px}
/* celular e tablet */
@media (max-width:1100px){.c8,.c6,.c4{grid-column:span 12}}
@media (max-width:900px){
  .lado{transform:translateX(-102%);transition:transform .22s ease;box-shadow:20px 0 50px rgba(0,0,0,.25)}
  body.menu .lado{transform:none}
  body.menu .fundo-menu{display:block;position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:25}
  .miolo{margin-left:0}
  .menu-bt{display:inline-flex}
  .topo{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));position:relative}
  #b-emitir{flex:1 1 auto}
  .topo h1{font-size:18px}
  .busca-g{order:9;flex:1 1 100%;min-width:0}
  .periodo{order:8;flex:1 1 auto;justify-content:space-between}
  main{padding:14px 16px 90px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}.kpi .n{font-size:22px}
  .graf{height:220px}
  .g2{grid-template-columns:1fr}
  /* tabelas viram cartões no celular */
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards tr{border:1px solid var(--li);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:#fff}
  table.cards td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.cards td:before{content:attr(data-r);color:var(--su);font-size:12px;font-weight:600;text-align:left;flex:none;max-width:45%}
  table.cards td .vv{min-width:0;text-align:right;overflow-wrap:anywhere}
  table.cards td .vv .acs{justify-content:flex-end}
  table.cards td.cheio{display:block;text-align:left}
  table.cards td.cheio .vv{text-align:left}
  table.cards td.cheio:before{display:block;margin-bottom:4px}
  .tw{margin:0;padding:0;overflow:visible}
}
</style>
</head>
<body>

<section id="entrada">
  <div class="cx-in">
    <a class="marca" style="color:var(--az)"><svg width="34" height="34" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1f3a5f"/><path d="M21 49 V15 H35 A9 9 0 0 1 35 33 H29 L42 48" fill="none" stroke="#eef3fa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="43" cy="49" r="6.3" fill="#22c55e"/></svg><span>Router<i style="color:var(--vd)">Flow</i></span></a>
    <div id="pass1">
      <h1>Painel do administrador</h1>
      <p style="margin:6px 0 14px">Entre com o seu e-mail e senha. Em seguida, o código do app autenticador.</p>
      <form id="f-login" style="display:flex;flex-direction:column;gap:12px">
        <label class="campo">E-mail<input id="l-email" type="email" autocomplete="username" required></label>
        <label class="campo">Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
        <button class="bt" id="b-entrar">Entrar</button>
      </form>
    </div>
    <div id="pass2" hidden>
      <h1 id="mfa-t">Verificação em duas etapas</h1>
      <p id="mfa-p" style="margin:6px 0 12px">Digite o código de 6 números do seu app autenticador.</p>
      <div id="mfa-qr" hidden><div class="qr"><img id="qr-img" alt="QR Code para o app autenticador"></div><p class="mut" style="font-size:12.5px;margin:8px 0 4px">Ou digite esta chave no app:</p><div class="seg" id="qr-seg"></div></div>
      <form id="f-mfa" style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
        <label class="campo">Código<input id="m-cod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label>
        <button class="bt">Confirmar</button>
        <button class="bt sec" type="button" id="b-sair1">Sair</button>
      </form>
    </div>
    <div class="erro" id="erro"></div>
  </div>
</section>

<section id="painel">
  <aside class="lado" id="lado">
    <a class="marca"><svg width="30" height="30" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1f3a5f" stroke="#3b5578"/><path d="M21 49 V15 H35 A9 9 0 0 1 35 33 H29 L42 48" fill="none" stroke="#eef3fa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="43" cy="49" r="6.3" fill="#22c55e"/></svg><span>Router<i>Flow</i></span></a>
    <nav id="nav"></nav>
    <div class="rod"><span id="quem"></span><button id="b-atual">Atualizar os dados</button><button id="b-sair">Sair</button></div>
  </aside>
  <div class="fundo-menu" id="fundo-menu"></div>
  <div class="miolo">
